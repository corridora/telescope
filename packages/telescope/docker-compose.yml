x-telescope: &telescope
  build:
    context: ../..
    dockerfile: packages/telescope/Dockerfile
  platform: linux/amd64
  init: true
  shm_size: 1gb
  security_opt:
    - seccomp=./docker/seccomp_profile.json
  volumes:
    - ./results:/app/results
  environment:
    HEADLESS: 'true'
    RUNNING_IN_DOCKER: 'true'
  stop_grace_period: 30s

services:
  telescope:
    <<: *telescope

  # Native Linux only. Load ifb on the host before enabling this profile.
  telescope-throttled:
    <<: *telescope
    profiles: [throttling]
    user: '0:0'
    cap_add:
      - NET_ADMIN
    volumes:
      - ./results:/app/results
      - /lib/modules:/lib/modules:ro
