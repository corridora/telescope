# Start this base before enrollment, then add compose.separate-agent.yml.
# Agent, controller, and target have distinct networks; fixed upstream proxies
# provide the intentional controller and target routes from the agent network.
services:
  controller:
    build:
      context: ../../..
      dockerfile: packages/telescope/Dockerfile
    platform: linux/amd64
    init: true
    shm_size: 1gb
    security_opt:
      - seccomp=./seccomp_profile.json
    command:
      - local
      - --host
      - 0.0.0.0
      - --port
      - '4321'
      - --resultsDir
      - /data
      - --no-open
    ports:
      - '127.0.0.1:4321:4321'
    environment:
      HEADLESS: 'true'
      RUNNING_IN_DOCKER: 'true'
      TELESCOPE_LOCAL_TOKEN: ${TELESCOPE_LOCAL_TOKEN:?Set a stable private administrator token of at least 24 characters}
      TELESCOPE_ALLOWED_HOSTS: controller,controller-gateway
    volumes:
      - controller-data:/data
    networks: [control]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4321/health').then(async r => process.exit(r.ok && (await r.json()).status === 'ready' ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    stop_grace_period: 30s

  controller-gateway:
    image: node:24-bookworm-slim
    init: true
    user: '1000:1000'
    command: [node, /fixture/gateway.mjs]
    read_only: true
    environment:
      LISTEN_PORT: '4321'
      UPSTREAM_HOST: controller
      UPSTREAM_PORT: '4321'
      UPSTREAM_TIMEOUT_MS: '30000'
    volumes:
      - ./fixtures/gateway.mjs:/fixture/gateway.mjs:ro
    networks: [execution, control]
    depends_on:
      controller:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4321/health').then(async r => process.exit(r.ok && (await r.json()).status === 'ready' ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    stop_grace_period: 10s

  gateway:
    image: node:24-bookworm-slim
    init: true
    user: '1000:1000'
    command: [node, /fixture/gateway.mjs]
    read_only: true
    volumes:
      - ./fixtures/gateway.mjs:/fixture/gateway.mjs:ro
    networks: [execution, target]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    stop_grace_period: 10s

  app:
    image: node:24-bookworm-slim
    init: true
    user: '1000:1000'
    command: [node, /fixture/target.mjs]
    read_only: true
    volumes:
      - ./fixtures/target.mjs:/fixture/target.mjs:ro
    networks: [target]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    stop_grace_period: 10s

networks:
  execution:
  control:
    internal: true
  target:
    internal: true

volumes:
  controller-data:
