# Start the controller and fixture before enrollment. Add compose.shared-agent.yml
# only after saving the scoped agent credential; see README.md beside this file.
services:
  controller:
    build:
      context: ../../..
      dockerfile: packages/telescope/Dockerfile
    platform: linux/amd64
    init: true
    shm_size: 1gb
    security_opt:
      - seccomp=./seccomp_profile.json
    command:
      - local
      - --host
      - 0.0.0.0
      - --port
      - '4321'
      - --resultsDir
      - /data
      - --no-open
    ports:
      - '127.0.0.1:4321:4321'
    environment:
      HEADLESS: 'true'
      RUNNING_IN_DOCKER: 'true'
      TELESCOPE_LOCAL_TOKEN: ${TELESCOPE_LOCAL_TOKEN:?Set a stable private administrator token of at least 24 characters}
      TELESCOPE_ALLOWED_HOSTS: controller
    volumes:
      - controller-data:/data
    networks: [execution]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4321/health').then(async r => process.exit(r.ok && (await r.json()).status === 'ready' ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    stop_grace_period: 30s

  app:
    image: node:24-bookworm-slim
    init: true
    user: '1000:1000'
    command: [node, /fixture/target.mjs]
    read_only: true
    volumes:
      - ./fixtures/target.mjs:/fixture/target.mjs:ro
    networks: [execution]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    stop_grace_period: 10s

networks:
  execution:

volumes:
  controller-data:
